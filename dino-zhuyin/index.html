body{font-family:ui-rounded,"SF Pro Rounded","Hiragino Maru Gothic ProN","PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif;
  color:var(--ink);font-weight:800;background:#bfe8ff;overflow-x:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{font:inherit;color:inherit;border:0;cursor:pointer;background:none}
.hide{display:none!important}
#bg{position:fixed;inset:0;z-index:-1;background:#bfe8ff center/cover no-repeat}
#bg.dim::after{content:"";position:absolute;inset:0;background:#ffffff8c}
img.dn{object-fit:contain;display:block}
/* 注音（字的右側直排） */
.zy{display:inline-flex;align-items:center;white-space:nowrap}
.z{position:relative;display:inline-flex;flex-direction:column;justify-content:center;align-items:center;font-size:.32em;line-height:1;width:1em;
  margin:0 .55em 0 .12em;font-weight:700;color:var(--ink);text-shadow:none;letter-spacing:0;
  font-family:"PingFang TC","Heiti TC","Microsoft JhengHei","Noto Sans TC","Noto Sans CJK TC",sans-serif}
.z i{font-style:normal;display:block;height:1em}
.z i.l{height:.55em;line-height:.55em}
.z i.hl,.z em.hl{color:#e8104e}
.z em{font-style:normal;position:absolute;left:88%;bottom:.2em;line-height:1}
.nozy .z{display:none}
.gBook .zy,.gCd .zy{font-size:0!important;vertical-align:middle}
.gBook{left:3%!important;right:3%!important;top:24%!important;bottom:4%!important;background:#fffdf3f5;border:4px solid #fff;border-radius:18px;box-shadow:0 5px 0 #0002;padding:6px;gap:calc(var(--bz,24px)*.3) calc(var(--bz,24px)*.22);align-items:center;align-content:center;line-height:1;color:#3b2a66;font-size:var(--bz,24px)!important;overflow:hidden}
.gBook .zy{flex:none;width:calc(var(--bz,24px)*2.05);height:calc(var(--bz,24px)*3.9);justify-content:center;background:#fff;border-radius:12px;box-shadow:0 3px 0 #e7c9a0}
.gBook .zy .z{font-size:var(--bz,24px);margin:0 .42em 0 0}
.gBook .brk{flex-basis:100%;height:0}
.gStage.tall #gField.ins:has(.gBook){aspect-ratio:auto;top:14%;bottom:3%}
.gStage.tall #gField.ins:has(.gBook) .gWho{display:none}
.gStage.tall .gBook{top:3%!important;bottom:3%!important}
.gBook .hole{flex:none;width:calc(var(--bz,24px)*2.05);height:calc(var(--bz,24px)*3.9);display:flex;align-items:center;justify-content:center;font-size:calc(var(--bz,24px)*1.4);margin:0;border-radius:12px;box-shadow:0 3px 0 #e0a92e}
.gBook>span[style] .zy{background:#ffe98a}
.gB .fb{display:flex;align-items:center;justify-content:center;min-width:1.5em;height:1.5em;padding:0 .2em;background:#fff;border:3px solid #3b2a66;border-radius:999px;font-size:clamp(24px,8vw,44px)!important;line-height:1;color:#e8104e;box-shadow:0 2px 0 #0003}
.gCd .zy .z{font-size:26px;margin:.1em .62em .1em .1em}
.gOpts.v3{flex-wrap:nowrap;gap:8px;align-items:stretch}
.gOpts.v3 .gCd{flex:1 1 0;min-width:0;padding:10px 4px;display:flex;justify-content:center;align-items:center;gap:3px;white-space:normal}
.gOpts.v3 .gCd .zy{flex:none;width:auto;height:auto}
.gOpts.v3 .gCd .zy .z{font-size:clamp(17px,5.4vw,26px);margin:.1em .55em .1em 0}
.gl,.tr{display:block;font:700 12px/1.2 ui-rounded,"Nunito",system-ui,sans-serif;color:#6a4fb4;white-space:normal;letter-spacing:0;text-align:center;font-style:normal}
.tr{flex-basis:100%;width:100%;font-size:13px;margin-top:5px;color:#5a4a7a}
.cell .gl{font-size:10px;line-height:1.1}
#pin .pRes .gl{font-size:13px}
#gField{position:absolute;inset:0}
.gStage.tall{aspect-ratio:.78;background-position:center top}
.gStage.tall.short{aspect-ratio:2.05;background-position:center 62%}
.gStage.tall.short #gField{inset:0;top:0;aspect-ratio:auto}
.gStage.short~#gPanel .gPad{width:min(58vw,300px,calc(100dvh - 400px));min-width:170px;margin-top:6px}
.gStage.short~#gPanel .gMsg{min-height:22px;margin-top:2px;font-size:16px}
.gStage.short~#gPanel .gRow{flex-wrap:nowrap;gap:5px}
.gStage.short~#gPanel .gRow .pill{padding-left:9px;padding-right:9px;font-size:15px;min-width:0}
.gStage.short~#gPanel .gRow .pill{padding-top:6px;padding-bottom:6px;white-space:nowrap}
.gStage.tall #gField{inset:auto;left:0;right:0;top:var(--ft,38%);aspect-ratio:1.5}
.gStage.tall #gField.ins{left:3%;right:3%;border-radius:18px;border:4px solid #fff;box-shadow:0 6px 0 #0003,0 8px 18px #0004;background-size:cover;background-position:center;overflow:hidden}
#gPanel:not(:empty){background:#fffffff2;border-radius:22px;margin:10px 12px 0;padding:10px 8px 12px;box-shadow:0 5px 0 #0002}
#gHud{position:relative;z-index:1}
.gStage.tall .gIntro{background:#fffffff0;inset:8% 5%;border-radius:22px;box-shadow:0 6px 0 #0002}
@media (max-width:699px) and (orientation:portrait){
body[data-v=chart] #bg{background-image:var(--pb1)!important}
body[data-v=list] #bg,body[data-v=sym] #bg,body[data-v=voc] #bg{background-image:var(--pb2)!important}
body[data-v=tone] #bg{background-image:var(--pb3)!important}
body[data-v=games] #bg,body[data-v=game] #bg{background-image:var(--pb4)!important}
body:is([data-v=chart],[data-v=list],[data-v=sym],[data-v=voc],[data-v=tone],[data-v=games],[data-v=game]) #bg{background-position:center}
body:is([data-v=chart],[data-v=list],[data-v=sym],[data-v=voc],[data-v=tone],[data-v=games],[data-v=game]) #bg.dim::after{background:none}
body:is([data-v=chart],[data-v=list],[data-v=sym],[data-v=voc],[data-v=tone],[data-v=games],[data-v=game]) section:not(.hide){padding-bottom:170px}
}
#splash{position:fixed;inset:0;z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;background:#bfe8ff center/cover no-repeat;transition:opacity .4s;cursor:pointer}
#splash.out{opacity:0;pointer-events:none}
#splash .spT{white-space:nowrap;font-size:clamp(30px,8.4vw,70px);font-weight:900;line-height:1.25;text-align:center;color:#fff;text-shadow:0 4px 0 #e2558b,0 0 14px #c9306c;background:#ff8fb8e6;padding:18px 26px;border-radius:30px;box-shadow:0 8px 0 #d9457f}
#splash .spT .z{color:#fff}
#splash .spB{font-size:clamp(26px,7vw,40px);font-weight:900;padding:14px 44px;border-radius:999px;background:linear-gradient(180deg,#ffe98a,#ffc93c);box-shadow:0 7px 0 #e09a1a;color:#5a3a00;animation:pop 1.2s infinite alternate}
body.rd #bg.dim::after{background:none}
body.rd #read .card,body.rd #story .card{background:#fffdf4ea;box-shadow:0 6px 0 #d9c79a,0 10px 22px #6b4a1a33;border:3px solid #fff}
body.rd #read,body.rd #story{padding-bottom:150px}
#rModes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
#rModes .pill{display:flex;align-items:center;justify-content:flex-start;gap:4px;padding:5px 6px;border-radius:18px;font-size:15px;min-width:0}
#rModes .pill img{width:40px;height:40px;object-fit:contain;flex:none}
#rModes .pill span{white-space:nowrap}
@media (min-width:700px){#rModes{grid-template-columns:repeat(4,minmax(0,1fr))}#rModes .pill{flex-direction:column;font-size:18px;padding:8px 4px}#rModes .pill img{width:76px;height:76px}}
:is(.zo.rTitle,.zo .rText,.zo .rLine,.zo .rWords,.zo .rSplit .big,.zo .sCard) .zy{font-size:0!important;vertical-align:middle;margin:0 2px;border-radius:8px}
:is(.zo.rTitle,.zo .rText,.zo .rLine,.zo .rWords,.zo .rSplit .big,.zo .sCard) .zy .z{font-size:var(--zo,22px);margin:.15em .62em .15em .12em}
.zo .rSplit .big{--zo:46px;line-height:1}.zo .sCard{--zo:16px}.zo .pu{display:none}.zo .sCard .pu,.zo .rSplit .pu{display:inline}
:is(.zo.rTitle,.zo .rText,.zo .rLine,.zo .rWords) .zy{flex:none;width:calc(var(--zo,22px)*2.05);height:calc(var(--zo,22px)*4);justify-content:center;align-items:center;margin:0;background:#fff;border-radius:13px;box-shadow:0 3px 0 var(--tb,#e7c9a0)}
:is(.zo.rTitle,.zo .rText,.zo .rLine,.zo .rWords) .zy .z{margin:0 .42em 0 0}
:is(.zo.rTitle,.zo .rText,.zo .rLine,.zo .rWords) .zy.say{background:#ffe98a;box-shadow:0 3px 0 #e0a92e}
.rTitle .zy.say{background:#ffe98a;border-radius:8px}
.zo.rTitle{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;--zo:24px;--tb:#f3a9c4;margin-top:8px}
.zo .rText{line-height:1;font-size:0}
.zo .sn,.zo .rLine{display:block;padding:8px;border-radius:18px;margin:8px 0;background:#ffe3ec;--tb:#f3a9c4;line-height:1;cursor:pointer}
.zo .t{display:flex;flex-wrap:nowrap;justify-content:center;gap:calc(var(--zo,22px)*.24);overflow:hidden;--zo:24px}
:is(.zo .sn,.zo .rLine):nth-of-type(5n+2){background:#dff1ff;--tb:#9cc9ef}:is(.zo .sn,.zo .rLine):nth-of-type(5n+3){background:#e2f7e6;--tb:#9ad6ab}:is(.zo .sn,.zo .rLine):nth-of-type(5n+4){background:#fff3c9;--tb:#ecc965}:is(.zo .sn,.zo .rLine):nth-of-type(5n){background:#ece4ff;--tb:#bda9ef}
.zo .sn.on,.zo .rLine.on{outline:4px solid #ffb400;outline-offset:-1px}
.zo .rWords button{display:flex;gap:5px;padding:8px;background:#ece4ff;--tb:#bda9ef}
.zo .rWords button:nth-child(4n+2){background:#dff1ff;--tb:#9cc9ef}.zo .rWords button:nth-child(4n+3){background:#e2f7e6;--tb:#9ad6ab}.zo .rWords button:nth-child(4n){background:#ffe3ec;--tb:#f3a9c4}
.zo .rWords button.on{outline:4px solid #ffb400}
.zy[data-c]{cursor:pointer;border-radius:8px;padding:2px 0}
.zy.say{background:#ffe98a}
.zy.tgt{color:#e8104e}
/* 共用 */
.pill{border-radius:999px;padding:8px 14px;font-size:17px;background:#fff;box-shadow:0 4px 0 #d9cdee,inset 0 2px 0 #fff;white-space:nowrap}
.pill:active{transform:translateY(3px);box-shadow:0 1px 0 #d9cdee}
.pill.on{background:#ffd43a;box-shadow:0 4px 0 #e69a00}
.bar{display:flex;align-items:center;gap:8px}
.bar h2{flex:1;margin:0;text-align:center;font-size:19px;color:var(--ink);white-space:nowrap}
.sticky{position:sticky;top:0;z-index:20;padding:8px 10px;background:#fffffff2;box-shadow:0 6px 16px #7a6a9626;border-radius:0 0 26px 26px}
.card{border-radius:26px;background:#ffffffee;box-shadow:0 8px 0 #d9cdee,0 14px 18px #7a6a9626;padding:14px;margin:16px 12px 0}
.spk{width:44px;height:44px;border-radius:50%;background:#fff center/72% no-repeat;background-image:var(--spk);box-shadow:0 4px 0 #f0b400;flex:none}
.spk:active{transform:translateY(3px);box-shadow:0 1px 0 #f0b400}
@keyframes bob{0%,100%{translate:0 0}50%{translate:0 -8px}}
@keyframes pop{0%{scale:.6;opacity:0}60%{scale:1.15;opacity:1}100%{scale:1}}
@keyframes shake{20%{translate:-8px 0}40%{translate:8px 0}60%{translate:-5px 0}80%{translate:5px 0}}
/* 首頁 */
#home{max-width:560px;margin:0 auto;padding:16px 16px 40px;text-align:center}
.hero{display:flex;justify-content:center;align-items:flex-end;height:120px}
.hero img{height:100px;width:auto;animation:bob 2.4s ease-in-out infinite;filter:drop-shadow(0 6px 5px #0003)}
.hero img:nth-child(2){height:120px;animation-delay:.5s}.hero img:nth-child(3){animation-delay:1s}
.title{font-size:clamp(28px,8.6vw,44px);line-height:1.25;margin:4px 0;letter-spacing:2px;color:#fff;
  text-shadow:0 2px 0 #ff8fb8,0 4px 0 #f0508c,0 6px 0 #c9306c,0 10px 14px #0005}
.title .z{color:#fff;text-shadow:0 1px 0 #c9306c,0 0 3px #c9306c}
.sub{display:inline-block;font-size:18px;background:#ffffffd9;border-radius:18px;padding:8px 12px;margin:8px 0}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:12px}
.mBtn{position:relative;border-radius:28px;padding:54px 6px 12px;font-size:20px;line-height:1.5;
  background:linear-gradient(180deg,#ffffff90 0%,transparent 46%),var(--c);
  box-shadow:0 9px 0 var(--d),0 16px 20px #0004,inset 0 3px 0 #ffffffd0}
.mBtn:active{transform:translateY(6px);box-shadow:0 3px 0 var(--d)}
.mBtn img{position:absolute;left:50%;top:-18px;height:70px;width:auto;translate:-50% 0;filter:drop-shadow(0 4px 4px #0003)}
.mBtn .tag{display:inline-block;font-size:13px;background:#fff;border-radius:999px;padding:2px 10px;margin-top:2px;color:var(--ink2)}
.mBtn.soon{filter:saturate(.55);opacity:.85}
/* 總表 */
#chart{max-width:1200px;margin:0 auto;padding-bottom:60px}
.stage{display:flex;align-items:center;gap:10px;margin-top:8px;padding:8px 10px;border-radius:22px;min-height:84px;
  background:linear-gradient(180deg,#ffffffa8 0%,transparent 55%),var(--pink);box-shadow:0 6px 0 var(--pinkD),inset 0 3px 0 #ffffffd0}
.stage .big{font-size:52px;line-height:1;color:#fff;text-shadow:0 2px 0 var(--pinkD),0 4px 0 var(--pinkD);min-width:58px;text-align:center;white-space:nowrap}
.stage img{height:66px;width:auto;max-width:90px;border-radius:12px;object-fit:cover}
.stage .wd{flex:1;font-size:24px;min-width:0}
.stage .pill{padding:5px 10px;font-size:15px}
.stage .sbt{display:flex;flex-direction:column;gap:7px}
.stage .wd.w3{font-size:19px}
.stage .hint{flex:1;font-size:17px;text-align:center}
.tools{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;justify-content:center}
.zone{margin:18px 10px 0;border-radius:26px;padding:12px 10px 14px;background:linear-gradient(180deg,#ffffff95 0%,transparent 30%),var(--c);
  box-shadow:0 8px 0 var(--d),0 14px 18px #7a6a9626,inset 0 3px 0 #ffffffd8}
.zone .hd{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.zone .hd b{flex:1;font-size:21px;letter-spacing:2px}
.cells{display:grid;grid-template-columns:repeat(4,1fr);gap:9px 7px}
.cell{border-radius:16px;padding:6px 2px 6px;background:linear-gradient(180deg,#fff,#fffaf4);box-shadow:0 5px 0 var(--d);display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
.cell:active{transform:translateY(3px)}
.cell .sy{font-size:30px;line-height:1.05;color:#e8104e;white-space:nowrap}
.cell.fin .sy{font-size:25px;writing-mode:vertical-rl;text-orientation:upright;letter-spacing:-3px;line-height:1;margin:1px 0 3px}
.cell img{width:86%;aspect-ratio:1.15;object-fit:cover;border-radius:10px}
.cell img.dn{object-fit:contain}
.cell .ch{font-size:19px;line-height:1.1;white-space:nowrap}
.cell .ch.w3{font-size:14px}
.cell.on{background:linear-gradient(180deg,#fffbd6,#ffe98a);box-shadow:0 5px 0 #e9b93a,0 0 0 4px #fff,0 0 18px 6px #ffd95a;animation:pop .45s both;z-index:2}
.symOnly .cell img,.symOnly .cell .ch{visibility:hidden}
/* 學符號：清單 */
#list{max-width:900px;margin:0 auto;padding-bottom:60px}
